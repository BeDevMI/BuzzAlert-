<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BuzzAlert</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><meta name="description" content="BuzzAlert: meld en volg controleurs op de lijn, samen voor heel Vlaanderen."><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BuzzAlert"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2300d4ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 14a12 12 0 0 0-12 12c0 14-6 18-6 18h36s-6-4-6-18a12 12 0 0 0-12-12zM28 48a4 4 0 0 0 8 0' fill='white'/%3E%3C/svg%3E"><meta name="theme-color" content="#12141c"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f1f2ff;--card:#fff;--ink:#14161f;--mute:#6a6f80;--acc:#7c5cff;--line:#e3e5ec;--sea:#d9ecff;--land:#ece8ff;--pin:#ff3d71;--dk:#0e1030;--acc2:#00d4ff;--gold:#ffc83d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080a1a;--card:#121634;--ink:#f2f3f7;--mute:#9298ab;--line:#262c55;--sea:#0b1a33;--land:#1a1745;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080a1a;--card:#121634;--ink:#f2f3f7;--mute:#9298ab;--line:#262c55;--sea:#0b1a33;--land:#1a1745;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:620px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.dk{background:var(--dk);color:#fff}
header{padding:18px 16px 16px;text-align:center;border-radius:0 0 24px 24px;background:linear-gradient(160deg,#1c2030,#0d0f16 70%);position:relative}
header img{height:84px;max-width:80%;object-fit:contain}
header p{margin:6px 0 0;color:#c9cde0;font-size:13px}
.stats{display:flex;gap:8px;margin:14px 12px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pin)}.stat span{font-size:12px;color:var(--mute)}
#mapbox{margin:12px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--sea);position:relative}

.land{fill:var(--land);stroke:var(--mute);stroke-width:1.5}.bru{fill:var(--acc);fill-opacity:.35;stroke:var(--mute)}
.cl{fill:var(--mute);font-size:15px;font-weight:600}
#hint{position:absolute;left:8px;top:8px;background:var(--dk);color:#fff;border-radius:10px;padding:5px 10px;font-size:12px}
main>section{margin:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
h2{font-size:18px;margin:0 0 4px}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:block;width:100%;text-align:center;text-decoration:none;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;margin-top:8px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.tag{display:inline-block;background:var(--pin);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:6px}
.sub{color:var(--mute);font-size:13px}.acts{display:flex;gap:6px;margin-top:8px}.acts button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.stars button{background:none;border:0;font-size:32px;color:var(--line);padding:0 2px}.stars button.on{color:var(--acc)}
.st{color:var(--acc);letter-spacing:2px}
.about{margin:12px;border-radius:20px;padding:20px 16px;text-align:center}
.about img{display:block;margin:0 auto}.about .sub{color:#aab0c4}
.store{display:flex;gap:10px;justify-content:center;margin-top:12px}.store img{height:44px;width:auto;border-radius:8px;opacity:.9}
nav{position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;display:flex;background:var(--dk);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;z-index:5}
nav button{flex:1;background:none;border:0;color:#9aa0b6;font:inherit;font-size:11px;padding:6px 0}nav button i{display:block;font-style:normal;font-size:20px}nav button.on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:596px;margin:0 auto;background:var(--dk);color:#fff;border-left:5px solid var(--acc);padding:13px 14px;border-radius:12px;display:none;z-index:9}
header{box-shadow:0 8px 24px rgba(0,0,0,.18)}header:after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:3px;background:var(--acc)}
#lang{position:absolute;top:10px;inset-inline-end:12px;width:auto;padding:6px 8px;background:#232738;color:#fff;border:1px solid #343a52;border-radius:10px;font-size:13px}
main>section,.stat,#mapbox{box-shadow:0 2px 10px rgba(20,22,31,.06)}
#ann{margin:12px 12px 0;padding:11px 14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600}
.vip{display:inline-block;background:var(--acc);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700}
.adm h3{margin:18px 0 6px;font-size:15px}.adm .item{display:flex;gap:8px;align-items:center;justify-content:space-between}.adm .item>div{min-width:0;overflow-wrap:anywhere}.adm .item button{flex:0 0 auto;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}.adm .item button.red{background:var(--pin);border-color:var(--pin);color:#fff}
nav button.on i{transform:translateY(-1px) scale(1.1)}
#auth{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}#auth .ah{padding:22px 16px;text-align:center;border-radius:0 0 24px 24px;background:linear-gradient(160deg,#1c2030,#0d0f16 70%)}#auth .ah img{height:90px;max-width:80%;object-fit:contain}#abox{max-width:420px;margin:0 auto;padding:16px}#aban{padding:30px 16px;text-align:center;font-size:16px}
input,select,textarea{font-size:16px}input[type=email]{text-overflow:ellipsis}
.btn.p,.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}.btn.p:disabled{opacity:.6}
#ann,.vip{background:linear-gradient(135deg,var(--acc),var(--acc2))}
header,#auth .ah{background:linear-gradient(150deg,#1d1250,#0b1230 55%,#06304a)!important}header:after{background:linear-gradient(90deg,var(--acc),var(--acc2))!important}
.about.dk{background:linear-gradient(160deg,#17114a,#0a1230 70%,#06304a)}
nav{background:linear-gradient(180deg,#14163d,#0a0c24)}nav button.on{color:var(--acc2)}
.stat b{background:linear-gradient(135deg,var(--acc),var(--pin));-webkit-background-clip:text;background-clip:text;color:transparent}
.st,.stars button.on{color:var(--gold)}.tag{box-shadow:0 0 12px rgba(255,61,113,.45)}
main>section,.stat{backdrop-filter:blur(6px)}

/* ===== v2 polish ===== */
html{-webkit-text-size-adjust:100%}
button,a,select,input{-webkit-tap-highlight-color:transparent}
button,.btn,.chip{touch-action:manipulation;cursor:pointer}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
label{font-weight:600;font-size:13px;color:var(--mute);margin:14px 0 6px}
input,select,textarea{min-height:46px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.22)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .12s,filter .15s,background .15s}
.btn.p{box-shadow:0 6px 18px rgba(124,92,255,.35)}
.btn:active,.chip:active,.acts button:active{transform:scale(.97)}
.btn.p:active{filter:brightness(.94)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:8px 14px;transition:transform .12s,background .15s}
.acts button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;font-weight:600;transition:transform .12s,background .15s}
.acts button:first-child .ic{color:#22c55e}.acts button:last-child .ic{color:var(--mute)}
.vip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px}
.item{padding:14px 0}
.item b{font-weight:650}
.tag{padding:2px 9px;border-radius:99px}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-weight:500}
#hint{display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
nav{padding-top:8px;box-shadow:0 -8px 28px rgba(0,0,0,.25)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.01em;transition:color .15s}
nav button i{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
nav button i .ic{width:22px;height:22px}
nav button.on i{transform:none;background:rgba(0,212,255,.14)}
nav button.on{font-weight:700}
#toast{display:none;align-items:center;gap:12px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.4);animation:tIn .28s ease-out}
#toast .ic{width:24px;height:24px;color:var(--pin)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 10px 20px;text-align:center;color:var(--mute)}
.empty .ic{width:38px;height:38px;opacity:.6}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes tIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== zoombare kaart ===== */
[hidden]{display:none!important}
#mapbox{isolation:isolate}
#map{height:min(64vh,470px);min-height:300px;background:var(--sea);font:inherit}
#hint{z-index:1000;left:50%;top:10px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 110px);text-align:center}
#mapbox.pick .leaflet-container{cursor:crosshair}
.bpin{position:relative;display:block;width:26px;height:26px}
.bpin i{position:absolute;border-radius:50%;display:block}
.bh{inset:0;background:#ff3d71;opacity:.35;animation:bp 2.2s ease-out infinite}
.bd{inset:6px;background:#ff3d71;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
@keyframes bp{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.leaflet-popup-content{margin:10px 14px;font:13px/1.4 system-ui,-apple-system,sans-serif}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--card);color:var(--ink);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--bg)}
.leaflet-control-attribution{font-size:10px}
@media (prefers-color-scheme:dark){.leaflet-control-attribution{background:rgba(8,10,26,.75)!important;color:#9298ab!important}.leaflet-control-attribution a{color:#b7bccf!important}}

.fbl span{position:absolute;white-space:nowrap;transform:translate(7px,-50%);font:600 12px system-ui,sans-serif;color:var(--mute);text-shadow:0 0 3px var(--card),0 0 3px var(--card)}
.fbl.m span{font-size:13px;color:var(--ink)}
.fbl.p span{transform:translate(-50%,-50%);font-size:14px;font-weight:700;letter-spacing:.04em;opacity:.75}
.mnote{position:absolute;left:8px;right:8px;bottom:26px;z-index:1000;background:#0e1030;color:#fff;font-size:12px;line-height:1.35;padding:7px 10px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tdark{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) saturate(.75)}
.medot{position:relative;display:block;width:22px;height:22px}.medot i{position:absolute;inset:3px;border-radius:50%;background:#2f80ff;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);animation:me 2.2s ease-out infinite}@keyframes me{0%{box-shadow:0 0 0 0 rgba(47,128,255,.55),0 2px 6px rgba(0,0,0,.45)}70%,100%{box-shadow:0 0 0 14px rgba(47,128,255,0),0 2px 6px rgba(0,0,0,.45)}}

.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13px;color:var(--ink);margin:14px 0 4px}
.chk input{width:20px;min-height:0;height:20px;margin:1px 0 0;flex:0 0 auto;accent-color:#7c5cff}
.sub a,.about a,.chk a{color:var(--acc2)}
.acts button.flagb{flex:0 0 auto;padding:8px 12px}.acts button:nth-child(2) .ic{color:var(--mute)}

#lg{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
#lgw{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 18px 70px;line-height:1.6}
#lgx{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:61;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
#lgb h1{font-size:26px;line-height:1.2;margin:8px 0 4px;letter-spacing:-.02em}#lgb h2{font-size:18px;margin:26px 0 6px}#lgb p,#lgb li{font-size:15px}#lgb .meta{color:var(--mute);font-size:14px}
#lgb mark{background:#ffe27a;color:#222;padding:0 4px;border-radius:4px}#lgb a{color:var(--acc2)}#lgb ul,#lgb ol{padding-left:20px}
#lgb table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}#lgb td,#lgb th{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}

#ob{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 70% at 50% 0%,#1d1250 0%,#0b1230 60%,#06101f 100%);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.obw{max-width:420px;width:100%;text-align:center;color:#f2f3f7;animation:obin .35s ease-out}
.obi{width:96px;height:96px;margin:0 auto 26px;border-radius:28px;background:linear-gradient(135deg,#7c5cff,#00d4ff);display:grid;place-items:center;box-shadow:0 14px 40px rgba(124,92,255,.5)}
.obi svg{width:48px;height:48px;color:#fff;stroke-width:1.8}
.obw h2{font-size:26px;line-height:1.2;margin:0 0 10px;letter-spacing:-.02em}.obw p{color:#b9bed2;line-height:1.55;margin:0 0 26px;font-size:16px}
.obd{display:flex;gap:8px;justify-content:center;margin:0 0 24px}.obd i{width:8px;height:8px;border-radius:99px;background:#3a4070;transition:all .25s}.obd i.on{width:24px;background:#7c5cff}
@keyframes obin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style></head><body>
<div id="auth"><div class="ah"><img id="alogo" alt="BuzzAlert"></div>
<div id="abox"><div class="chips" style="justify-content:center"><button class="chip on" id="tl"></button><button class="chip" id="tr"></button></div>
<div id="fr"><label id="lnick"></label><input id="anick" maxlength="20" autocomplete="nickname"></div>
<label id="lmail"></label><input id="amail" type="email" autocomplete="email">
<label id="lpw"></label><input id="apw" type="password">
<div id="fr2"><label id="lpw2"></label><input id="apw2" type="password" autocomplete="new-password"></div>
<div id="fr3"><label class="chk"><input type="checkbox" id="aterm"><span id="aterml"></span></label></div><p class="sub" id="apriv"></p><button class="btn p" id="ago"></button><button class="chip" id="forgot" style="margin-top:10px"></button><p class="sub" id="amsg"></p><button class="btn" id="demo" type="button"></button><p class="sub" id="alinks" style="text-align:center;margin-top:14px"></p></div>
